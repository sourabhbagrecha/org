<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sourabh Bagrecha</title>
<meta name="description" content="Sourabh Bagrecha — personal website.">
<meta name="theme-color" content="#efeae1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23111'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%23ff5a1f' font-family='serif' font-style='italic'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efeae1;
    --ink: #121110;
    --mute: #7a746a;
    --accent: #ff5a1f;
    --serif: "Instrument Serif", "Times New Roman", serif;
    --sans: "Inter", system-ui, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0d0c; --ink: #efeae1; --mute: #8a847a; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }
  @media (hover: none) { body { cursor: auto; } }

  canvas#field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* film grain */
  body::after {
    content: ""; position: fixed; inset: -50%; z-index: 5; pointer-events: none; opacity: .08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0) } 20% { transform: translate(-3%,2%) } 40% { transform: translate(2%,-3%) }
    60% { transform: translate(-2%,-2%) } 80% { transform: translate(3%,3%) } 100% { transform: translate(0,0) }
  }

  main {
    position: relative; z-index: 2; height: 100%;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 3.2vw, 44px);
  }

  .top, .bottom {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute);
  }
  .top { align-items: flex-start; }
  .top .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 10px; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.5); opacity: .5; } }

  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(64px, 15.5vw, 260px);
    line-height: .86; letter-spacing: -.03em;
  }
  h1 .line { display: block; overflow: hidden; padding: .04em 0 .2em; margin-bottom: -.12em; }
  h1 .line span {
    display: inline-block; transform: translateY(110%);
    animation: rise 1.3s var(--ease) forwards;
  }
  h1 .line:nth-child(2) { padding-left: clamp(0px, 8vw, 140px); }
  h1 .line:nth-child(2) span { animation-delay: .12s; font-style: italic; }
  h1 .line span { transition: transform .5s var(--ease); }
  @keyframes rise { to { transform: translateY(0); } }

  .tagline {
    margin-top: clamp(20px, 2.4vw, 40px);
    padding-left: clamp(0px, 8vw, 140px);
    max-width: 36ch;
    font-family: var(--serif); font-size: clamp(20px, 2vw, 30px); line-height: 1.25; letter-spacing: -.01em;
    color: var(--mute);
    opacity: 0; animation: fade 1.2s .7s var(--ease) forwards;
  }
  .tagline b { color: var(--ink); font-weight: 400; font-style: italic; }
  @keyframes fade { to { opacity: 1; } }

  .links { display: flex; gap: clamp(16px, 2.4vw, 36px); opacity: 0; animation: fade 1.2s .9s var(--ease) forwards; }
  .links a {
    color: var(--ink); text-decoration: none; position: relative; padding: 4px 0;
  }
  .links a::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%;
    background: var(--accent); transform: scaleX(0); transform-origin: right; transition: transform .5s var(--ease);
  }
  .links a.project { color: var(--accent); }
  .links a:hover::after { transform: scaleX(1); transform-origin: left; }
  .links a:hover { color: var(--accent); }

  .top, .time { opacity: 0; animation: fade 1.2s .5s var(--ease) forwards; }


  /* previously */
  .stage { position: relative; align-self: center; }
  .work {
    position: absolute; right: 0; bottom: .6em; list-style: none;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(18px, 2.6vw, 40px) clamp(20px, 3vw, 48px);
    width: min(330px, 30vw);
    opacity: 0; animation: fade 1.2s 1.1s var(--ease) forwards;
  }
  .work li { position: relative; height: clamp(40px, 4.2vw, 60px); transition: opacity .4s var(--ease); }
  .work i {
    display: block; width: 100%; height: 100%;
    background: var(--ink); opacity: .85;
    -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
    transition: background .4s var(--ease), transform .5s var(--ease), opacity .4s var(--ease);
  }
  .work li::after {
    content: attr(data-label); position: absolute; left: 50%; top: calc(100% + 8px); transform: translate(-50%, -4px);
    white-space: nowrap; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute);
    opacity: 0; transition: opacity .4s var(--ease), transform .4s var(--ease); pointer-events: none;
  }
  .work:hover li { opacity: .3; }
  .work li:hover { opacity: 1; }
  .work li:hover i { background: var(--c); transform: scale(1.14) rotate(-4deg); opacity: 1; }
  .work li:hover::after { opacity: 1; transform: translate(-50%, 0); }
  .work-label { display: none; }
  @media (max-width: 900px) {
    .work { position: static; width: 100%; max-width: 360px; margin-top: 36px; }
  }

  /* custom cursor */
  #cursor {
    position: fixed; z-index: 10; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; background: var(--accent); pointer-events: none;
    transition: width .35s var(--ease), height .35s var(--ease), margin .35s var(--ease);
  }
  #cursor.big { width: 64px; height: 64px; margin: -32px 0 0 -32px; }
  @media (hover: none) { #cursor { display: none; } }

  @media (max-width: 640px) {
    .bottom { flex-direction: column; align-items: flex-start; }
    .time { order: 2; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, body::after { animation-duration: .01ms !important; animation-delay: 0s !important; }
  }
</style>
</head>

<script>
(() => {
  const cvs = document.getElementById('field');
  const ctx = cvs.getContext('2d');
  const cur = document.getElementById('cursor');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR, cols, rows, pts = [];
  const GAP = 34;
  const mouse = { x: -999, y: -999, sx: -999, sy: -999 };
  let t = 0;

  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cols = Math.ceil(W / GAP) + 1; rows = Math.ceil(H / GAP) + 1;
    pts = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) pts.push({ ox: i * GAP, oy: j * GAP, x: i * GAP, y: j * GAP, vx: 0, vy: 0 });
  }

  function frame() {
    t += 0.008;
    mouse.sx += (mouse.x - mouse.sx) * 0.12;
    mouse.sy += (mouse.y - mouse.sy) * 0.12;
    cur.style.transform = `translate(${mouse.sx}px, ${mouse.sy}px)`;

    const ink = css('--ink'), accent = css('--accent');
    ctx.clearRect(0, 0, W, H);

    // soft accent glow following cursor
    if (mouse.sx > -500) {
      const g = ctx.createRadialGradient(mouse.sx, mouse.sy, 0, mouse.sx, mouse.sy, 320);
      g.addColorStop(0, accent + '40'); g.addColorStop(1, accent + '00');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    const R = 180;
    for (const p of pts) {
      // ambient drift
      const dx0 = Math.sin(t + p.oy * 0.012) * 3, dy0 = Math.cos(t * 1.1 + p.ox * 0.012) * 3;
      let tx = p.ox + dx0, ty = p.oy + dy0, near = 0;
      const dx = p.ox - mouse.sx, dy = p.oy - mouse.sy, d = Math.hypot(dx, dy);
      if (d < R) {
        const f = (1 - d / R); near = f;
        const push = f * f * 46;
        tx += (dx / (d || 1)) * push; ty += (dy / (d || 1)) * push;
      }
      p.vx += (tx - p.x) * 0.12; p.vy += (ty - p.y) * 0.12;
      p.vx *= 0.8; p.vy *= 0.8;
      p.x += p.vx; p.y += p.vy;

      const r = 1 + near * 2.6;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832);
      ctx.fillStyle = near > 0.05 ? accent : ink;
      ctx.globalAlpha = near > 0.05 ? 0.35 + near * 0.65 : 0.18;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }

  addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (mouse.sx < -500) { mouse.sx = mouse.x; mouse.sy = mouse.y; }
  });
  addEventListener('pointerleave', () => { mouse.x = mouse.y = -999; });
  document.querySelectorAll('a, h1').forEach(el => {
    el.addEventListener('pointerenter', () => cur.classList.add('big'));
    el.addEventListener('pointerleave', () => cur.classList.remove('big'));
  });
  addEventListener('resize', resize);
  resize(); frame();

  // headline shifts subtly with cursor
  const lines = document.querySelectorAll('h1 .line');
  addEventListener('pointermove', e => {
    const nx = (e.clientX / innerWidth - .5), ny = (e.clientY / innerHeight - .5);
    lines.forEach((l, i) => { l.style.transform = `translate(${nx * (i ? -22 : 22)}px, ${ny * 10}px)`; });
  });

  // local time
  const tEl = document.getElementById('time');
  const tick = () => { tEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · Local time'; };
  tick(); setInterval(tick, 30000);
})();
</script>
